name: Publish daily Instagram post

on:
  schedule:
    - cron: "7 * * * *"        # hourly; the script itself decides if a post is due (time is set in config/settings.json)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build a preview, do NOT publish)"
        type: boolean
        default: true
      force:
        description: "Ignore posting time / already-posted-today check"
        type: boolean
        default: false

permissions:
  contents: write              # commit generated images, history and logs
  models: read                 # optional: free GitHub Models (caption rephrasing)

concurrency:
  group: ski-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-v1

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          PYTHONPATH: src
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python -m skibot

      - name: Upload dry-run preview
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/
